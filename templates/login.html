<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BUS-TED! Campus Bus Tracking</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0b1329 0%, #1e293b 100%);
      padding: 20px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 440px;
      padding: 36px 32px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-logo {
      width: 52px;
      height: 52px;
      background: #fbbf24;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 12px;
      box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4);
    }
    .demo-accounts {
      margin-top: 24px;
      padding: 16px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius-md);
    }
    .demo-btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="fa-solid fa-bus"></i>
      </div>
      <h2 style="font-size: 24px; font-weight: 800; color: #0f172a;">BUS-TED!</h2>
      <p style="font-size: 13px; color: #64748b; margin-top: 4px;">Catch your bus before it catches you.</p>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="email"><i class="fa-regular fa-envelope"></i> College Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="akshay@bustd.edu" required>
      </div>

      <div class="form-group">
        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="padding: 12px; font-size: 15px; margin-top: 8px;">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In to Portal
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 13px; color: #64748b;">
      Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register here</a>
    </div>

    <!-- Quick Hackathon Demo Credentials Helper -->
    <div class="demo-accounts">
      <div style="font-size: 12px; font-weight: 700; color: #475569; display: flex; align-items: center; justify-content: space-between;">
        <span><i class="fa-solid fa-bolt" style="color: #f59e0b;"></i> Hackathon Demo Fast Login</span>
      </div>
      <div class="demo-btn-group">
        <button type="button" class="btn btn-outline btn-sm btn-block" onclick="fillDemo('akshay@bustd.edu', 'student123')">
          <i class="fa-solid fa-graduation-cap"></i> Student
        </button>
        <button type="button" class="btn btn-outline btn-sm btn-block" onclick="fillDemo('rajesh@bustd.edu', 'driver123')">
          <i class="fa-solid fa-id-card"></i> Driver
        </button>
      </div>
    </div>
  </div>

  <script>
    function fillDemo(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
    }
  </script>
</body>
</html>
