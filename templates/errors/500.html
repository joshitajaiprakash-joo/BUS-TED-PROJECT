{% extends 'base.html' %}

{% block title %}System Error - BUS-TED!{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 60px 20px; max-width: 540px; margin: 40px auto;">
  <div style="font-size: 64px; color: #ef4444; margin-bottom: 16px;">
    <i class="fa-solid fa-triangle-exclamation"></i>
  </div>
  <h2 style="font-size: 26px; font-weight: 800; color: #0f172a;">500 - Server Error</h2>
  <p style="font-size: 14px; color: var(--text-muted); margin: 8px 0 24px;">
    An internal server error occurred while processing your request. Please try again shortly.
  </p>
  <div>
    <a href="{{ url_for('index') }}" class="btn btn-primary">
      <i class="fa-solid fa-house"></i> Return to Campus Dashboard
    </a>
  </div>
</div>
{% endblock %}
